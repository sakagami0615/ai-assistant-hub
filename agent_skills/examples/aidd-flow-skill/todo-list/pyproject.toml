[project]
name = "todo-list"
version = "0.1.0"
description = "A small server-rendered Django todo list"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.0,<6.1",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<1.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

