<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="350" viewBox="0 0 1060 350" role="img" aria-label="メインエージェント内の decision-twin 本体が、質問文だけを回答役に渡し、回答と根拠を検証役に渡す。回答役と検証役は memory を読むだけで、書くのは本体だけ。ユーザーには確認質問と代理回答一覧だけが戻る。">
<style>
svg { --surface:#ffffff;--ink:#1d2430;--muted:#5d6878;--line:#c9d0da;--ai:#2f5d8a;--ai-soft:#e6eef7;--human:#b26a00;--human-soft:#fdf1df;
--font-body:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif;--font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; color: var(--ink); }
@media (prefers-color-scheme: dark) { svg { --surface:#1a2029;--ink:#e4e8ee;--muted:#9aa5b4;--line:#36404d;--ai:#8db6e0;--ai-soft:#1f2d3d;--human:#f0b25a;--human-soft:#3a2a14; } }
.bg { fill: var(--surface); }
/* SVG の部品 */
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.box-ai { fill: var(--ai-soft); stroke: var(--ai); stroke-width: 1.5; }
.box-human { fill: var(--human-soft); stroke: var(--human); stroke-width: 1.5; }
.frame { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 4; }
.t { fill: currentColor; font-size: 13px; font-family: var(--font-body); }
.t-b { fill: currentColor; font-size: 14px; font-weight: 700; font-family: var(--font-body); }
.t-s { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
.t-m { fill: var(--muted); font-size: 12px; font-family: var(--font-mono); }
.t-ai { fill: var(--ai); font-size: 12px; font-family: var(--font-body); }
.t-h { fill: var(--human); font-size: 12px; font-weight: 500; font-family: var(--font-body); }
.ln { stroke: currentColor; stroke-width: 1.4; fill: none; }
.ln-ai { stroke: var(--ai); stroke-width: 1.4; fill: none; }
.ln-h { stroke: var(--human); stroke-width: 1.8; fill: none; }
.head { fill: currentColor; }
.head-ai { fill: var(--ai); }
.head-h { fill: var(--human); }
</style>
<rect class="bg" width="1060" height="350" rx="8"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
    <marker id="a1ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-ai"/></marker>
    <marker id="a1h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-h"/></marker>
  </defs>

  <!-- ユーザー -->
  <rect x="20" y="180" width="110" height="80" rx="6" class="box-human"/>
  <text x="75" y="216" text-anchor="middle" class="t-b">ユーザー</text>
  <text x="75" y="238" text-anchor="middle" class="t-s">決めるのは本人</text>

  <!-- メインエージェント -->
  <rect x="250" y="30" width="320" height="300" rx="8" class="frame"/>
  <text x="266" y="52" class="t-s">メインエージェント（同じセッション）</text>
  <rect x="270" y="65" width="280" height="50" rx="6" class="box"/>
  <text x="410" y="95" text-anchor="middle" class="t">質問役（grilling / brainstorming）</text>
  <rect x="270" y="165" width="280" height="150" rx="6" class="box-ai"/>
  <text x="410" y="195" text-anchor="middle" class="t-b">decision-twin 本体</text>
  <text x="410" y="222" text-anchor="middle" class="t">分類（class・impact・可逆性）</text>
  <text x="410" y="244" text-anchor="middle" class="t">ゲート判定（固定の7規則）</text>
  <text x="410" y="266" text-anchor="middle" class="t">表示・記録</text>
  <text x="410" y="294" text-anchor="middle" class="t-s">質問役の推奨は表示用にだけ持つ</text>

  <!-- 質問役 ⇄ 本体 -->
  <line x1="310" y1="115" x2="310" y2="163" class="ln" marker-end="url(#a1)"/>
  <text x="318" y="144" class="t-s">ラウンド</text>
  <line x1="420" y1="163" x2="420" y2="117" class="ln" marker-end="url(#a1)"/>
  <text x="428" y="144" class="t-s">確定した回答</text>

  <!-- 本体 ⇄ ユーザー -->
  <line x1="270" y1="205" x2="132" y2="205" class="ln-h" marker-end="url(#a1h)"/>
  <text x="200" y="197" text-anchor="middle" class="t-h">確認質問・一覧</text>
  <line x1="130" y1="245" x2="268" y2="245" class="ln-h" marker-end="url(#a1h)"/>
  <text x="200" y="263" text-anchor="middle" class="t-h">回答・承認</text>

  <!-- 回答役・検証役 -->
  <rect x="640" y="160" width="180" height="70" rx="6" class="box"/>
  <text x="730" y="187" text-anchor="middle" class="t-b">twin-answerer</text>
  <text x="730" y="210" text-anchor="middle" class="t-m">Read / Grep / Glob</text>
  <rect x="640" y="250" width="180" height="70" rx="6" class="box"/>
  <text x="730" y="277" text-anchor="middle" class="t-b">twin-verifier</text>
  <text x="730" y="300" text-anchor="middle" class="t-m">Read / Grep / Glob</text>

  <line x1="550" y1="180" x2="638" y2="180" class="ln-ai" marker-end="url(#a1ai)"/>
  <text x="594" y="174" text-anchor="middle" class="t-ai">質問文だけ</text>
  <line x1="640" y1="215" x2="552" y2="215" class="ln" marker-end="url(#a1)"/>
  <text x="596" y="232" text-anchor="middle" class="t-s">回答 JSON</text>
  <line x1="550" y1="268" x2="638" y2="268" class="ln-ai" marker-end="url(#a1ai)"/>
  <text x="594" y="262" text-anchor="middle" class="t-ai">質問＋回答</text>
  <line x1="640" y1="303" x2="552" y2="303" class="ln" marker-end="url(#a1)"/>
  <text x="596" y="320" text-anchor="middle" class="t-s">判定</text>

  <!-- memory -->
  <rect x="880" y="60" width="160" height="260" rx="6" class="box"/>
  <text x="960" y="88" text-anchor="middle" class="t-b">memory/</text>
  <text x="960" y="106" text-anchor="middle" class="t-s">スキルフォルダ内</text>
  <text x="896" y="175" class="t-m">decisions/*.md</text>
  <text x="896" y="205" class="t-m">principles.md</text>
  <text x="896" y="235" class="t-m">log.jsonl</text>
  <text x="896" y="265" class="t-m">config.json</text>

  <line x1="820" y1="195" x2="878" y2="195" class="ln" marker-end="url(#a1)"/>
  <text x="849" y="188" text-anchor="middle" class="t-s">読む</text>
  <line x1="820" y1="285" x2="878" y2="285" class="ln" marker-end="url(#a1)"/>
  <text x="849" y="278" text-anchor="middle" class="t-s">読む</text>
  <polyline points="520,165 520,138 878,138" class="ln" marker-end="url(#a1)"/>
  <text x="700" y="130" text-anchor="middle" class="t-s">書く（判断ノート・log・原則）</text>
</svg>
