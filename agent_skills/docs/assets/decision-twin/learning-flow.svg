<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="130" viewBox="0 0 1060 130" role="img" aria-label="学習フローは、題材の候補から1つ選び、推奨なしの質問に1問ずつ答え、答えるたびに判断ノートと log に記録し、終了時に原則の追記案を承認する。">
<style>
svg { --surface:#ffffff;--ink:#1d2430;--muted:#5d6878;--line:#c9d0da;--ai:#2f5d8a;--ai-soft:#e6eef7;--human:#b26a00;--human-soft:#fdf1df;
--font-body:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif;--font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; color: var(--ink); }
@media (prefers-color-scheme: dark) { svg { --surface:#1a2029;--ink:#e4e8ee;--muted:#9aa5b4;--line:#36404d;--ai:#8db6e0;--ai-soft:#1f2d3d;--human:#f0b25a;--human-soft:#3a2a14; } }
.bg { fill: var(--surface); }
/* SVG の部品 */
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.box-ai { fill: var(--ai-soft); stroke: var(--ai); stroke-width: 1.5; }
.box-human { fill: var(--human-soft); stroke: var(--human); stroke-width: 1.5; }
.frame { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 4; }
.t { fill: currentColor; font-size: 13px; font-family: var(--font-body); }
.t-b { fill: currentColor; font-size: 14px; font-weight: 700; font-family: var(--font-body); }
.t-s { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
.t-m { fill: var(--muted); font-size: 12px; font-family: var(--font-mono); }
.t-ai { fill: var(--ai); font-size: 12px; font-family: var(--font-body); }
.t-h { fill: var(--human); font-size: 12px; font-weight: 500; font-family: var(--font-body); }
.ln { stroke: currentColor; stroke-width: 1.4; fill: none; }
.ln-ai { stroke: var(--ai); stroke-width: 1.4; fill: none; }
.ln-h { stroke: var(--human); stroke-width: 1.8; fill: none; }
.head { fill: currentColor; }
.head-ai { fill: var(--ai); }
.head-h { fill: var(--human); }
</style>
<rect class="bg" width="1060" height="130" rx="8"/>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  </defs>
  <rect x="20" y="30" width="180" height="70" rx="6" class="box"/>
  <text x="110" y="60" text-anchor="middle" class="t-b">題材を選ぶ</text>
  <text x="110" y="82" text-anchor="middle" class="t-s">リポジトリから3〜5件</text>
  <rect x="236" y="30" width="200" height="70" rx="6" class="box-human"/>
  <text x="336" y="60" text-anchor="middle" class="t-b">1問ずつ答える</text>
  <text x="336" y="82" text-anchor="middle" class="t-s">選択肢に推奨の印は付けない</text>
  <rect x="472" y="30" width="200" height="70" rx="6" class="box"/>
  <text x="572" y="60" text-anchor="middle" class="t-b">その場で記録</text>
  <text x="572" y="82" text-anchor="middle" class="t-s">出所「学習」＋ log</text>
  <rect x="708" y="30" width="160" height="70" rx="6" class="box"/>
  <text x="788" y="60" text-anchor="middle" class="t-b">「終わり」</text>
  <text x="788" y="82" text-anchor="middle" class="t-s">または題材を変える</text>
  <rect x="904" y="30" width="136" height="70" rx="6" class="box-human"/>
  <text x="972" y="60" text-anchor="middle" class="t-b">原則案を承認</text>
  <text x="972" y="82" text-anchor="middle" class="t-s">principles.md</text>
  <line x1="200" y1="65" x2="234" y2="65" class="ln" marker-end="url(#a4)"/>
  <line x1="436" y1="65" x2="470" y2="65" class="ln" marker-end="url(#a4)"/>
  <line x1="672" y1="65" x2="706" y2="65" class="ln" marker-end="url(#a4)"/>
  <line x1="868" y1="65" x2="902" y2="65" class="ln" marker-end="url(#a4)"/>
  <polyline points="572,100 572,118 336,118 336,102" class="ln" marker-end="url(#a4)"/>
  <text x="454" y="113" text-anchor="middle" class="t-s">次の質問</text>
</svg>
